[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powerchain"
version = "0.7.0"
description = "A cleaner, more powerful alternative to LangChain"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Stanley Samwel", email = "owinostanley03@gmail.com"}
]
keywords = ["llm", "agents", "langchain", "rag", "ai", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "typing-extensions>=4.5",
    "httpx>=0.25",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.5",
]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.34"]
groq = ["openai>=1.0"]  # uses OpenAI-compatible client
all = ["openai>=1.0", "anthropic>=0.34"]

[project.urls]
Homepage = "https://github.com/Stanley03-arch/powerchain"
Repository = "https://github.com/Stanley03-arch/powerchain"

[tool.setuptools.packages.find]
where = ["."]
include = ["powerchain*"]

[tool.ruff]
line-length = 100
target-version = "py310"
